<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landlord Ledger Pro</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18263a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#17324e;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:1.3rem;margin:0}main{max-width:1100px;margin:auto;padding:22px 16px}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#1769aa;color:white;font-weight:650}nav button{background:#e0eaf4;color:#17324e}nav button.active{background:#1769aa;color:white}.panel{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #1232}h2{margin:0 0 12px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-size:.9rem;font-weight:600}input,select{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid #c7d3df;border-radius:8px;font:inherit}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4eaf0} .scroll{overflow-x:auto}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.cards .panel{margin:0} .number{font-size:1.5rem;font-weight:750} .danger{color:#a12424}.hidden{display:none} .notice{background:#fff6db;padding:12px;border-radius:9px} @media print{header,nav,button,form,.no-print{display:none!important}main{padding:0}.panel{box-shadow:none}}
</style></head><body><header><h1>🏠 Landlord Ledger Pro</h1><span>Independent landlord dashboard</span></header><main><div class="notice">Prototype: data stays in this browser only. Use fictional test data, not real tenant information. Export backups regularly.</div><nav id="nav"></nav><section id="view"></section></main><script>
const tabs=['Dashboard','Properties','Tenants','Transactions','Ledger'];let tab='Dashboard';const key='llp_v1';
let db;try{db=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}db=db&&Array.isArray(db.properties)&&Array.isArray(db.tenants)&&Array.isArray(db.transactions)?db:{properties:[],tenants:[],transactions:[]};
const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>String(Date.now())+Math.random().toString(36).slice(2,7),save=()=>{try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('Browser storage unavailable. Please use a regular Chrome tab, not private mode.');return false}},option=(arr,placeholder)=>'<option value="">'+placeholder+'</option>'+arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('')}
function rows(headers,items){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+items.join('')+'</tbody></table></div>'}
function field(name,label,type='text',extra=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" '+extra+' required></label>'}
function select(name,label,opts){return '<label>'+label+'<select name="'+name+'" required>'+opts+'</select></label>'}
function render(){nav();let v=document.getElementById('view');let props=db.properties,ten=db.tenants,tx=db.transactions;
if(tab==='Dashboard'){let income=tx.filter(x=>x.kind==='payment').reduce((s,x)=>s+x.amount,0),expense=tx.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.amount,0),charges=tx.filter(x=>x.kind==='charge').reduce((s,x)=>s+x.amount,0);v.innerHTML='<h2>Portfolio Overview</h2><div class="cards">'+[['Properties',props.length],['Tenants',ten.length],['Rent received',money(income)],['Outstanding charges',money(charges-income)],['Recorded expenses',money(expense)],['Cash after expenses',money(income-expense)]].map(a=>'<div class="panel"><div class="muted">'+a[0]+'</div><div class="number">'+a[1]+'</div></div>').join('')+'</div><div class="panel"><p>Start with <b>Properties</b>, then add tenants and enter rent charges and payments.</p><button data-tab="Properties">Add a property</button></div>'}
if(tab==='Properties')v.innerHTML='<div class="panel"><h2>Add Property</h2><form id="propertyForm">'+field('name','Property name')+field('address','Street address')+field('units','Number of units','number','min="1" value="1"')+'<button type="submit">Save property</button></form></div><div class="panel"><h2>Properties</h2>'+rows(['Name','Address','Units'],props.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.address)+'</td><td>'+esc(p.units)+'</td></tr>'))+'</div>';
if(tab==='Tenants')v.innerHTML='<div class="panel"><h2>Add Tenant</h2><form id="tenantForm">'+select('propertyId','Property',option(props,'Choose property'))+field('name','Tenant name')+field('rent','Monthly tenant rent','number','min="0" step=".01"')+field('hap','Monthly housing assistance','number','min="0" step=".01" value="0"')+'<button type="submit">Save tenant</button></form></div><div class="panel"><h2>Tenants</h2>'+rows(['Tenant','Property','Tenant rent','Assistance'],ten.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(props.find(p=>p.id===t.propertyId)?.name)+'</td><td>'+money(t.rent)+'</td><td>'+money(t.hap)+'</td></tr>'))+'</div>';
if(tab==='Transactions')v.innerHTML='<div class="panel"><h2>Record Transaction</h2><form id="transactionForm">'+select('tenantId','Tenant',option(ten,'Choose tenant'))+select('kind','Type','<option value="charge">Rent or fee charged</option><option value="payment">Payment received</option><option value="expense">Property expense</option>')+field('date','Date','date','value="'+new Date().toISOString().slice(0,10)+'"')+field('amount','Amount ($)','number','min="0.01" step=".01"')+field('note','Description')+'<button type="submit">Save transaction</button></form></div><div class="panel"><h2>Transactions</h2>'+rows(['Date','Tenant','Type','Amount','Description'],[...tx].reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(ten.find(t=>t.id===x.tenantId)?.name)+'</td><td>'+esc(x.kind)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.note)+'</td></tr>'))+'</div>';
if(tab==='Ledger')v.innerHTML='<div class="panel"><h2>Tenant Ledger</h2><label>Choose tenant<select id="ledgerTenant">'+option(ten,'Select tenant')+'</select></label><p class="muted">Ledger shows entered charges and payments only. Expenses are excluded from tenant balances.</p><button id="print">Print / Save PDF</button></div><div id="ledgerOutput"></div>';
}
function ledger(){let t=db.tenants.find(x=>x.id===document.getElementById('ledgerTenant')?.value),el=document.getElementById('ledgerOutput');if(!t){el.innerHTML='';return}let balance=0,items=db.transactions.filter(x=>x.tenantId===t.id&&x.kind!=='expense').sort((a,b)=>a.date.localeCompare(b.date)).map(x=>{balance+=x.kind==='charge'?x.amount:-x.amount;return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.note)+'</td><td>'+esc(x.kind)+'</td><td>'+money(x.amount)+'</td><td>'+money(balance)+'</td></tr>'});el.innerHTML='<div class="panel"><h2>'+esc(t.name)+'</h2><p>Property: '+esc(db.properties.find(p=>p.id===t.propertyId)?.address)+'</p><p><b>Balance: '+money(balance)+'</b></p>'+rows(['Date','Description','Type','Amount','Balance'],items)+'</div>'}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}if(e.target.id==='print')window.print()});document.addEventListener('change',e=>{if(e.target.id==='ledgerTenant')ledger()});
document.addEventListener('submit',e=>{if(!['propertyForm','tenantForm','transactionForm'].includes(e.target.id))return;e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(e.target.id==='propertyForm'){db.properties.push({...d,id:id(),units:Number(d.units)})}if(e.target.id==='tenantForm'){db.tenants.push({...d,id:id(),rent:Number(d.rent),hap:Number(d.hap)})}if(e.target.id==='transactionForm'){db.transactions.push({...d,id:id(),amount:Number(d.amount)})}if(save())render()});render();
</script></body></html>
